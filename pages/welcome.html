<div id="welcomePage" class="welcome-page">

  <div id="welcomeArt" class="welcome-art"></div>
  <div class="welcome-overlay"></div>
  <div class="welcome-center-glow"></div>

  <div class="welcome-content">

    <div class="welcome-badge">LinguaLog</div>

    <h1 class="welcome-title">
      Build the version of you you want to meet
    </h1>

    <p class="welcome-subtitle">
      Track your thoughts, words, memories, and growth in one beautiful journal space.
    </p>

    <div class="welcome-actions">
      <button class="welcome-primary-btn" onclick="quickStartFromHome('general')">
        Start your journal
      </button>

      <button class="welcome-secondary-btn" onclick="showLibraryPage()">
        Go to library
      </button>

      <button class="welcome-secondary-btn" onclick="openAuthModal()">
        Login / Sign Up
      </button>

      <button
        id="installPwaBtn"
        class="welcome-secondary-btn hidden"
        onclick="installLinguaLog()"
      >
        Install LinguaLog
      </button>
    </div>

  </div>

</div>
