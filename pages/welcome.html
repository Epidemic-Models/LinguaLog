<div class="welcome-actions">

  <button
    class="welcome-primary-btn"
    onclick="quickStartFromHome('general')"
  >
    Start your journal
  </button>

  <button
    class="welcome-secondary-btn"
    onclick="showLibraryPage()"
  >
    Go to library
  </button>

  <button
    class="welcome-secondary-btn"
    onclick="openAuthModal()"
  >
    Login / Sign Up
  </button>

  <button
    id="installPwaBtn"
    class="welcome-secondary-btn hidden"
    onclick="installLinguaLog()"
  >
    Install LinguaLog
  </button>

</div>
